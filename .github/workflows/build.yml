name: build-kdrw
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: restore sources
        run: |
          mkdir -p kbuild tools
          mkdir -p template
          echo 'b2JqLW0gOj0ga2Rydy5vCg==' | base64 -d > kbuild/Makefile
          echo '' | base64 -d > kbuild/kdrw.c
          echo '' | base64 -d > pack.sh
          echo '' | base64 -d > kdrw.sh.in
          echo '' | base64 -d > kdrw.h
          echo '' | base64 -d > tools/verify.sh
          echo '' | base64 -d > 'template/读写.h'

      - name: host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev python3 build-essential gcc g++ lld

      # 必须与手机内核同版本 clang(12.0.5/r416183b)，否则 CFI 类型 id 不匹配会 panic
      - name: android clang r416183b
        run: |
          git clone --depth 1 https://github.com/Guxin12/clang-12.0.5-r416183b clangpre
          echo "$PWD/clangpre/bin" >> "$GITHUB_PATH"
          $PWD/clangpre/bin/clang --version | head -1

      - name: kernel tree GKI android12-5.10
        run: |
          git clone --depth 1 -b android12-5.10 https://android.googlesource.com/kernel/common linux
          rm -rf linux/.git
          df -h .

      - name: config + prepare + build symbols
        run: |
          cd linux
          export CC="$PWD/../clangpre/bin/clang --target=aarch64-linux-gnu"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="$CC" HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld.bfd gki_defconfig 2>&1 | tee /tmp/cfg.log || { tail -60 /tmp/cfg.log; exit 1; }
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="$CC" HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld.bfd -j"$(nproc)" modules_prepare 2>&1 | tee /tmp/prep.log || { echo "=== PREP FAILED ==="; tail -80 /tmp/prep.log; df -h; exit 1; }
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="$CC" HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld.bfd -j"$(nproc)" modules

      - name: build kdrw.ko
        run: |
          export CC="$PWD/clangpre/bin/clang --target=aarch64-linux-gnu"
          $CC --version | head -1
          make -C linux M="$PWD/kbuild" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="$CC" HOSTCC=gcc HOSTLD=ld.bfd modules
          ls -la kbuild/kdrw.ko

      - name: pack kdrw.sh
        run: |
          python3 pack.sh kbuild/kdrw.ko kdrw.sh
          chmod +x kdrw.sh
          ls -la kdrw.sh kbuild/kdrw.ko

      - name: publish to artifact branch
        run: |
          git config user.name "kdrw-bot"
          git config user.email "kdrw-bot@users.noreply.github.com"
          cp kdrw.sh /tmp/kdrw.sh
          cp kbuild/kdrw.ko /tmp/kdrw.ko
          git branch -D artifact 2>/dev/null || true
          git checkout --orphan artifact
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/kdrw.sh kdrw.sh
          cp /tmp/kdrw.ko kdrw.ko
          printf 'built at %s\n' "$(date -u)" > BUILD_OK.txt
          git add -f kdrw.sh kdrw.ko BUILD_OK.txt
          git commit -m "built kdrw.sh + kdrw.ko"
          git push -f origin artifact
